name: MOMent AI checks

on:
  push:
    branches: [main, "feature/moment-ai-live-launch"]
    paths:
      - "projects/01-moment-ai/**"
      - ".github/workflows/moment-ai-checks.yml"
  pull_request:
    paths:
      - "projects/01-moment-ai/**"
      - ".github/workflows/moment-ai-checks.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/01-moment-ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/01-moment-ai/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/01-moment-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/01-moment-ai/frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
